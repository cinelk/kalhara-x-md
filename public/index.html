<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALHARA-X-MD | WhatsApp Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: #0f172a; color: #f8fafc; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; width: 400px; height: 400px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 50%; filter: blur(120px); z-index: -1;
            animation: float 6s ease-in-out infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(-50px) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }
        .container {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px;
            border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 92%; max-width: 420px; text-align: center;
        }
        h2 {
            font-size: 28px; font-weight: 700; margin-bottom: 10px;
            background: linear-gradient(to right, #f472b6, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p.sub { font-size: 14px; color: #94a3b8; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        input {
            width: 100%; padding: 15px 20px; background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: #fff; font-size: 16px; outline: none; transition: all 0.3s ease;
        }
        input:focus { border-color: #ec4899; box-shadow: 0 0 15px rgba(236, 72, 153, 0.3); }
        button {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: none; border-radius: 12px; color: white; font-size: 16px;
            font-weight: 600; cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(236, 72, 153, 0.4); }
        button:disabled { opacity: .6; cursor: wait; }
        #code-box {
            margin-top: 25px; background: rgba(15, 23, 42, 0.8);
            border: 2px dashed #ec4899; padding: 15px; border-radius: 12px; display: none;
        }
        #code-box h3 { font-size: 14px; color: #cbd5e1; margin-bottom: 8px; }
        #pairing-code { font-size: 26px; font-weight: 700; color: #f472b6; letter-spacing: 2px; word-break: break-all; }
        #pairing-code.ready { cursor: pointer; user-select: all; }
        #pairing-code.ready:hover { opacity: .85; }
        .hint { margin-top: 12px; font-size: 12px; color: #94a3b8; }
        .err { color: #f87171; font-size: 13px; margin-top: 10px; }
        .footer { margin-top: 25px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>KALHARA-X-MD</h2>
        <p class="sub">Enter your WhatsApp number with country code to get the pairing code.</p>

        <div class="input-group">
            <input type="tel" id="phone" placeholder="e.g. 9471XXXXXXX" inputmode="numeric">
        </div>

        <button id="btn" onclick="getPairCode()">Generate Pair Code</button>

        <div id="code-box">
            <h3>YOUR PAIRING CODE:</h3>
            <div id="pairing-code">------</div>
            <div class="hint" id="copy-hint" style="display:none">👆 Code එක touch කරන්න, copy වෙනවා</div>
            <div class="err" id="err"></div>
            <div class="hint">WhatsApp → Linked Devices → Link with phone number → මේ code එක විනාඩියක් ඇතුළත ගහන්න</div>
        </div>

        <div class="footer">Powered by DMP • KALHARA &copy; 2026</div>
    </div>

    <script>
        const codeDisplay = document.getElementById('pairing-code');
        const errEl = document.getElementById('err');
        const copyHint = document.getElementById('copy-hint');
        const codeBox = document.getElementById('code-box');
        const btn = document.getElementById('btn');

        function showError(msg) {
            codeBox.style.display = 'block';
            codeDisplay.classList.remove('ready');
            codeDisplay.innerText = '------';
            copyHint.style.display = 'none';
            errEl.textContent = msg;
        }

        async function getPairCode() {
            const phone = document.getElementById('phone').value.trim();
            errEl.textContent = '';

            if (!phone) return showError('WhatsApp අංකය ඇතුළත් කරන්න!');
            if (phone.replace(/\D/g, '').startsWith('0')) return showError('0 න් පටන් ගන්න එපා. රට කේතය සමඟ ගහන්න (94771234567)');

            btn.disabled = true;
            codeDisplay.classList.remove('ready');
            copyHint.style.display = 'none';
            codeDisplay.innerText = 'Generating...';
            codeBox.style.display = 'block';

            try {
                const res = await fetch('/pair?phone=' + encodeURIComponent(phone));
                const data = await res.json();
                if (data.code) {
                    codeDisplay.innerText = data.code;
                    codeDisplay.dataset.code = data.code;
                    codeDisplay.classList.add('ready');
                    copyHint.style.display = 'block';
                } else {
                    showError(data.error || 'Code එක generate කරන්න බැරි වුණා.');
                }
            } catch (err) {
                showError('Server connection error!');
            }
            btn.disabled = false;
        }

        codeDisplay.addEventListener('click', async () => {
            const text = codeDisplay.dataset.code;
            if (!codeDisplay.classList.contains('ready') || !text) return;
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const t = document.createElement('textarea');
                t.value = text; document.body.appendChild(t); t.select();
                document.execCommand('copy'); t.remove();
            }
            codeDisplay.innerText = 'Copied ✓';
            setTimeout(() => { codeDisplay.innerText = text; }, 1200);
        });
    </script>
</body>
</html>
